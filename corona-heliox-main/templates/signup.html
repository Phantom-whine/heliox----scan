{% extends 'base.html' %}

{% block title %}Create Account — HELIOX{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-black font-mono-num text-xs">
    <div class="max-w-sm w-full bg-zinc-950 border border-zinc-800 rounded-lg p-6 sm:p-8 space-y-5">
        
        <div class="text-center space-y-1.5">
            <div class="w-9 h-9 rounded bg-blue-600 mx-auto flex items-center justify-center text-white text-xs font-bold">
                <i class="fa-solid fa-chart-simple"></i>
            </div>
            <h1 class="text-lg font-bold text-white font-sans">Create Free Account</h1>
            <p class="text-[11px] text-zinc-400 font-sans">Free lifetime access to terminal, alerts & API</p>
        </div>

        <form class="space-y-3.5" action="{% url 'signup' %}" method="POST">
            {% csrf_token %}

            <div>
                <label class="block text-[11px] font-semibold text-zinc-300 mb-1 font-sans">Username *</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-zinc-500 text-xs">@</span>
                    <input type="text" name="username" required placeholder="username" 
                           class="w-full bg-zinc-900 border border-zinc-800 rounded pl-8 pr-3 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-blue-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-semibold text-zinc-300 mb-1 font-sans">Email (Optional)</label>
                <input type="email" name="email" placeholder="you@domain.com" 
                       class="w-full bg-zinc-900 border border-zinc-800 rounded px-3 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-blue-500 transition">
            </div>

            <div>
                <label class="block text-[11px] font-semibold text-zinc-300 mb-1 font-sans">Telegram Handle (Optional)</label>
                <input type="text" name="telegram_username" placeholder="tg_handle" 
                       class="w-full bg-zinc-900 border border-zinc-800 rounded px-3 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-blue-500 transition">
            </div>

            <div>
                <label class="block text-[11px] font-semibold text-zinc-300 mb-1 font-sans">Password *</label>
                <input type="password" name="password" required placeholder="••••••••••••" 
                       class="w-full bg-zinc-900 border border-zinc-800 rounded px-3 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-blue-500 transition">
            </div>

            <div>
                <label class="block text-[11px] font-semibold text-zinc-300 mb-1 font-sans">Confirm Password *</label>
                <input type="password" name="password_confirm" required placeholder="••••••••••••" 
                       class="w-full bg-zinc-900 border border-zinc-800 rounded px-3 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-blue-500 transition">
            </div>

            <div class="pt-2 font-sans">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-4 rounded transition text-xs">
                    Create Free Account
                </button>
            </div>
        </form>

        <div class="text-center pt-3 border-t border-zinc-800 text-[11px] text-zinc-400 font-sans">
            Already have an account? 
            <a href="{% url 'login' %}" class="text-blue-400 hover:underline font-semibold ml-1">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
